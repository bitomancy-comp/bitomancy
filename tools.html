<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Tools — BITOMANCY</title><meta name="description" content="Free practical tools from BITOMANCY."><link rel="canonical" href="https://bitomancy.in/tools.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/">BITOMANCY</a><nav class="desktop-nav"><a href="/">HOME</a><a href="/tools.html">TOOLS</a><a href="/shop.html">SHOP</a></nav><div class="nav-actions"><button class="icon-btn" id="themeBtn">☼</button></div></div></header><main class="container section"><div class="eyebrow">BITOMANCY TOOLS</div><h1>Free tools for everyday digital work.</h1><p class="muted">Fast, simple utilities. No account required for the client-side tools below.</p><div class="tool-grid" style="margin-top:35px"><section class="tool" id="word-counter"><h2>Word Counter</h2><textarea id="wc" style="width:100%;min-height:180px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:12px"></textarea><p id="wcout">0 words · 0 characters</p></section><section class="tool" id="case"><h2>Case Converter</h2><textarea id="casein" style="width:100%;min-height:120px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:12px"></textarea><button class="button" onclick="document.getElementById('casein').value=document.getElementById('casein').value.toUpperCase()">UPPERCASE</button> <button class="button" onclick="document.getElementById('casein').value=document.getElementById('casein').value.toLowerCase()">lowercase</button></section><section class="tool" id="meta"><h2>Meta Description Helper</h2><textarea id="metaIn" maxlength="160" placeholder="Write a concise page description..." style="width:100%;min-height:120px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:12px"></textarea><p id="metac">0 / 160</p></section><section class="tool" id="outline"><h2>Blog Outline Generator</h2><input id="topic" placeholder="Enter a topic" style="width:100%;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--line)"><button class="button" style="margin-top:10px" onclick="outline()">Generate outline</button><div id="out"></div></section></div></main><script src="/script.js"></script><script>const wc=document.getElementById('wc');wc.oninput=()=>{let t=wc.value.trim();document.getElementById('wcout').textContent=`${t?t.split(/\\s+/).length:0} words · ${wc.value.length} characters`};const mi=document.getElementById('metaIn');mi.oninput=()=>document.getElementById('metac').textContent=`${mi.value.length} / 160`;function outline(){let t=document.getElementById('topic').value||'Your Topic';document.getElementById('out').innerHTML=`<h3>${t}</h3><ol><li>Introduction</li><li>What is ${t}?</li><li>Key benefits and features</li><li>How it works</li><li>Practical examples</li><li>Common mistakes</li><li>Best practices</li><li>Conclusion and next steps</li></ol>`}</script></body></html>
