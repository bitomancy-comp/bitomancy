name: Update Post Index

# Runs automatically whenever you push a new or edited post, and rebuilds
# posts.json, sitemap.xml and rss.xml from whatever is in posts/*.html.
# No API keys, no paid services — this only uses GitHub's free Actions minutes.

on:
  push:
    branches: [main]
    paths:
      - "posts/**.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Rebuild posts.json, sitemap.xml, rss.xml
        run: node scripts/build-index.js

      - name: Commit and push if changed
        run: |
          git config user.name "bitomancy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.json sitemap.xml rss.xml
          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "chore: auto-update post index"
            git push
          fi
