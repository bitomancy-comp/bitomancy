<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact BITOMANCY</title><link rel="canonical" href="https://bitomancy.in/contact.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/">BITOMANCY</a><a class="text-link" href="/">← Home</a></div></header><main class="container section" style="max-width:700px"><div class="eyebrow">CONTACT</div><h1>Get in touch.</h1><p class="muted">Use this form after connecting it to your preferred form/email provider.</p><form style="display:grid;gap:12px" onsubmit="event.preventDefault();document.getElementById('msg').textContent='Thanks. Connect a form provider to receive this message.'"><input required placeholder="Name" style="padding:13px;background:var(--surface);color:var(--text);border:1px solid var(--line)"><input required type="email" placeholder="Email" style="padding:13px;background:var(--surface);color:var(--text);border:1px solid var(--line)"><input required placeholder="Subject" style="padding:13px;background:var(--surface);color:var(--text);border:1px solid var(--line)"><textarea required placeholder="Message" style="min-height:180px;padding:13px;background:var(--surface);color:var(--text);border:1px solid var(--line)"></textarea><button class="button">Send message</button><p id="msg"></p></form></main><script src="/script.js"></script></body></html>
