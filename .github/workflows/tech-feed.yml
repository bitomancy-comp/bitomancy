name: Update Technology Feed

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  update-tech-feed:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build technology feed
        run: node scripts/build-tech-feed.js

      - name: Commit updated feed
        run: |

          git config user.name "BITOMANCY Bot"

          git config user.email "actions@users.noreply.github.com"

          git add tech-feed.json

          git diff --cached --quiet || git commit -m "Update technology feed"

          git push
